; ==============================================================================
; PlatformIO Configuration File: MAX30102 + ESP32-S3 Raw PPG System
; Microcontroller: ESP32-S3 (ESP32-S3-WROOM-1-N16R8: 16MB Flash, 8MB Octal PSRAM)
; Framework: Arduino
; ==============================================================================

[platformio]
; Select the test_raw_ppg environment in PlatformIO toolbar
default_envs = test_raw_ppg
description = MAX30102 + ESP32-S3 Raw PPG Acquisition System

; ------------------------------------------------------------------------------
; Common Hardware Base for ESP32-S3 N16R8
; ------------------------------------------------------------------------------
[env_base]
platform = espressif32 @ ^6.5.0
board = esp32-s3-devkitc-1
framework = arduino

; Serial Monitor & Upload Configuration
; Recommendation: Use 115200 for the first upload to eliminate packet framing issues
upload_speed = 115200
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

; Port Configuration: CH343 UART Bridge on COM9
upload_port = COM9
monitor_port = COM9

; Partition Scheme for 16MB Flash
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.filesystem = littlefs

; N16R8 Module Hardware Architecture:
; - N16: 16MB Quad SPI Flash (qio)
; - R8: 8MB Octal SPI PSRAM (opi)
; - Combined memory type: qio_opi
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_build.f_flash = 80000000L
board_build.f_cpu = 240000000L

build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=0
    -D ARDUINO_USB_MODE=0
    -D BOARD_HAS_PSRAM
    -D CORE_DEBUG_LEVEL=3

; ------------------------------------------------------------------------------
; Environment 1 (Active Default): Step 4/5 Raw Sensor Test
; ------------------------------------------------------------------------------
[env:test_raw_ppg]
extends = env_base
upload_port = COM9
monitor_port = COM9
upload_speed = 115200
build_src_filter = +<test_raw_ppg.cpp>
lib_deps =
    sparkfun/SparkFun MAX3010x Pulse and Proximity Sensor Library @ ^1.1.2

; ------------------------------------------------------------------------------
; Environment 2: Step 6 Full Live Wi-Fi Dashboard (Dual-Core FreeRTOS + WebSocket)
; ------------------------------------------------------------------------------
[env:esp32-s3-dashboard]
extends = env_base
build_src_filter = +<main.cpp> +<sensor_manager.cpp> +<web_server_manager.cpp>
build_flags =
    ${env_base.build_flags}
    -D WS_MAX_QUEUED_MESSAGES=64
lib_deps =
    sparkfun/SparkFun MAX3010x Pulse and Proximity Sensor Library @ ^1.1.2
    bblanchon/ArduinoJson @ ^7.3.0
    mathieucarbou/ESPAsyncWebServer @ ^3.6.0
    mathieucarbou/AsyncTCP @ ^3.3.2
